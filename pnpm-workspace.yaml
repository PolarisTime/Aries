packages:
  - tools/typescript-toolchain

# ⚠️ 刻意保留两个 typescript 版本，**不要**把 typescript 加进下面的 overrides：
#   - 根项目 typescript 7.0.2 是 Go 原生重写版，包只导出 `lib/version.cjs` 与 `unstable/*`
#     （实测 `require('typescript')` 只有 version 等 2 个键，没有 createProgram / ts.sys）；
#   - typescript-eslint 的类型感知 lint 依赖经典 JS API（createProgram / ts.sys / AST），
#     无法运行在 7.x 上，因此 tools/typescript-toolchain 精确锁 5.9.3 专供 eslint 使用。
# 统一版本会让 `pnpm lint` 与 `pnpm typecheck` 中的一方直接不可用。
overrides:
  "@babel/core@<7.29.6": 7.29.6
  "baseline-browser-mapping@<2.11.0": 2.11.0
  "brace-expansion@<1.1.18": 1.1.18
  "brace-expansion@>=3.0.0 <5.0.9": 5.0.9
  "browserslist@<4.28.7": 4.28.7
  "fast-uri@>=3.0.0 <3.1.6": 3.1.6
  "js-yaml@>=4.0.0 <4.3.2": 4.3.2
  "nanoid@<3.3.18": 3.3.18
  "postcss@<8.5.26": 8.5.26
  semver: ^7.7.4
  "shell-quote@<=1.8.4": 1.9.0
  "undici@<6.28.0": 6.28.0
  "undici@>=7.0.0 <7.29.0": 7.29.0
  "ws@>=8.0.0 <8.21.0": 8.21.0
  # zod: <4.5.0 存在 __proto__ 原型污染（catchall merge / object·record 解析器未剥离
  # __proto__，AIKIDO-2026-10707 / -500926），<4.6.6 另有数组校验内存耗尽 DoS
  # （AIKIDO-2026-143019）。统一钉到已修复的 4.6.7，防止传递依赖带回旧版。
  "zod@<4.6.6": 4.6.7

minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - brace-expansion@1.1.18
  - deslop-js
  - oxlint-plugin-react-doctor
  - react-doctor
trustPolicy: no-downgrade

allowBuilds:
  '@sentry/cli': true
  esbuild: true
