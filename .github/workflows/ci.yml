name: frontend-ci

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Lint
        run: pnpm lint

      - name: Check frontend API contract boundary
        run: pnpm contract:check

      # antd 官方规范检查(a11y / 废弃 API / 用法 / 性能)。
      # CLI 不是仓库依赖, 这里固定版本临时拉取; 注意 antd lint 发现违规仍返回 0, 必须解析输出。
      - name: Check antd usage (official lint)
        run: |
          npx --yes -p @ant-design/cli@6.6.2 antd lint src | tee /tmp/antd-lint.txt
          if grep -q '⚠' /tmp/antd-lint.txt; then
            echo "::error::antd lint 发现违规用法(见上方 a11y / deprecated 明细)"
            exit 1
          fi

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Typecheck
        run: pnpm typecheck

  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up frontend
        uses: ./.github/actions/setup-frontend
      - name: Run unit tests
        run: pnpm test

  build:
    name: Build & Artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up frontend
        uses: ./.github/actions/setup-frontend

      - name: Build frontend
        run: pnpm build-only

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: aries-dist
          path: dist
          if-no-files-found: error
