# React Doctor — finds security, performance, correctness, accessibility,
# bundle-size, and architecture issues in React codebases.
#
# Docs: https://www.react.doctor/cli
# Source: https://github.com/millionco/react-doctor
#
# 直接调用 react-doctor CLI（固定 0.9.5，与项目依赖一致）并上传 JSON 报告为 artifact，
# 使每次扫描的详细 findings（errors/warnings 逐条）可见、可定位修复；
# 同时发布 commit status 保留分数趋势。

name: React Doctor

on:
  # Scans the PR's changed files (full project on push).
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Scans `main` on every push to track the health-score trend and catch regressions that slipped past PR review.
  push:
    branches: ["main"]

permissions:
  contents: read
  statuses: write

# Cancels any in-flight scan for the same PR (or branch, on push) the moment a new commit arrives, so reviewers only ever see the latest run.
concurrency:
  group: react-doctor-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  react-doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run React Doctor scan
        id: scan
        run: |
          set -euo pipefail
          npm exec --yes --package react-doctor@0.9.5 -- \
            react-doctor --json --yes . > react-doctor-report.json
          {
            echo "RD_SCORE=$(jq -r '.summary.score // 0' react-doctor-report.json)"
            echo "RD_ERRORS=$(jq -r '.summary.errorCount // 0' react-doctor-report.json)"
            echo "RD_WARNINGS=$(jq -r '.summary.warningCount // 0' react-doctor-report.json)"
          } >> "$GITHUB_ENV"
          jq -r '"Score: \(.summary.score)/100 · \(.summary.errorCount) errors · \(.summary.warningCount) warnings"' \
            react-doctor-report.json

      - name: Upload React Doctor report
        uses: actions/upload-artifact@v4
        with:
          name: react-doctor-report
          path: react-doctor-report.json
          if-no-files-found: error

      - name: Publish commit status
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.repos.createCommitStatus({
              ...context.repo,
              sha: context.sha,
              context: 'React Doctor',
              state: 'success',
              description: `Score: ${process.env.RD_SCORE}/100 · ${process.env.RD_ERRORS} errors · ${process.env.RD_WARNINGS} warnings`,
            })
